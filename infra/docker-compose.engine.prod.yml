# Bushpop V2 — production stack deployed by Coolify (coolify.bushpop.xyz, homelab 154.26.158.150).
#
# Single internal network. On the Bushpop homelab, Coolify's Traefik proxy is
# DISABLED — Caddy fronts everything — so unlike the upstream piklo-v2 compose the
# web/api services DO publish host ports (3210/3334) for Caddy to reach:
#   market.bushpop.xyz → :3210   ·   api.bushpop.xyz → :3334
# Ports live here in the compose file, not in Coolify's UI (its API rejects
# localhost port mappings). No Traefik labels.
#
# Secrets/URLs come from Coolify's env UI (NEVER committed). Generated by Claude:
# BUSHPOP_DB_PASSWORD, MEILI_MASTER_KEY, BETTER_AUTH_SECRET. Provided by Ben:
# STRIPE_SECRET_KEY (sk_test_), STARSHIPIT_*, R2_*. STRIPE_WEBHOOK_SECRET is a
# placeholder until Phase 5. See docs/OPS-RUNBOOK.md → Production Deploy.
#
# Build context is the repo root (`..` relative to this file).

services:
  bushpop-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bushpop
      POSTGRES_USER: bushpop
      POSTGRES_PASSWORD: ${BUSHPOP_DB_PASSWORD}
    volumes:
      - bushpop-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bushpop -d bushpop"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bushpop-net

  bushpop-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - bushpop-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bushpop-net

  bushpop-meilisearch:
    image: getmeili/meilisearch:v1.40
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - bushpop-meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bushpop-net

  api:
    build:
      context: ..
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    depends_on:
      bushpop-db:
        condition: service_healthy
      bushpop-redis:
        condition: service_healthy
      bushpop-meilisearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # --- internal service URLs (container network) ---
      DATABASE_URL: postgres://bushpop:${BUSHPOP_DB_PASSWORD}@bushpop-db:5432/bushpop
      REDIS_URL: redis://bushpop-redis:6379
      MEILISEARCH_HOST: http://bushpop-meilisearch:7700
      # --- public-facing URLs (boot + CORS) ---
      WEB_URL: ${WEB_URL:-https://market.bushpop.xyz}
      ADMIN_URL: ${ADMIN_URL:-https://admin.bushpop.xyz}
      API_URL: ${API_URL:-https://api.bushpop.xyz}
      CHANNEL_SLUG: ${CHANNEL_SLUG:-bushpop}
      # --- generated secrets (Coolify) ---
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # --- Ben-provided secrets (test/sandbox) ---
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STARSHIPIT_API_KEY: ${STARSHIPIT_API_KEY}
      STARSHIPIT_WEBHOOK_SECRET: ${STARSHIPIT_WEBHOOK_SECRET}
      STARSHIPIT_SUBSCRIPTION_KEY: ${STARSHIPIT_SUBSCRIPTION_KEY:-}
      # --- Cloudflare R2 (required for image upload + URLs) ---
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # Coolify re-syncs env rows from this file on EVERY deploy: a non-empty
      # `:-default` here CLOBBERS any Coolify-stored value, so defaults must BE
      # the real staging values. Swap both to media.bushpop.com.au at cutover.
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-bushpop-images}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://pub-3c7f819593c94086b71e9663605d4c11.r2.dev}
      # --- optional / graceful fallback ---
      # GEMINI is the ai-draft worker's primary model; ANTHROPIC the escalation.
      # Worker stays off unless at least one is set.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Operator-alert destination (stuck ops, payout/migration failures).
      # Defaults to admin@bushpop.com.au if unset — override in Coolify. INF-H2.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bushpop.com.au}
    ports:
      - "3334:3333"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - bushpop-net

  web:
    build:
      context: ..
      dockerfile: apps/market/Dockerfile
      args:
        # Baked into the same-origin /api proxy rewrite at build time.
        API_BASE_URL: http://api:3333
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        # BUILD-TIME bake (Next inlines NEXT_PUBLIC_*). Without it the web image
        # ships loadStripe("") and checkout silently dies. Ben sets the pk_test_
        # value in Coolify; Coolify forwards it as a build arg. See INF-C1.
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        # BUILD-TIME bake: next.config.ts derives images.remotePatterns from
        # this URL's hostname. Default mirrors the api service's R2_PUBLIC_URL
        # default below so web + api can never disagree on the media host.
        R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://pub-3c7f819593c94086b71e9663605d4c11.r2.dev}
        # Chatwoot support widget — dormant (empty default) until Ben sets both
        # in Coolify + redeploys. See docs/support-widget.md for the values.
        NEXT_PUBLIC_CHATWOOT_BASE_URL: ${NEXT_PUBLIC_CHATWOOT_BASE_URL:-}
        NEXT_PUBLIC_CHATWOOT_WEBSITE_TOKEN: ${NEXT_PUBLIC_CHATWOOT_WEBSITE_TOKEN:-}
    restart: unless-stopped
    depends_on:
      api:
        # Gates on the api container healthcheck (/health/live). Liveness only
        # passes AFTER migrate-on-boot finishes and Fastify binds the port, so
        # web does not serve before migrations complete. The probe stays on
        # /health/live (not /health/ready) so a Stripe/Meili outage can't trip a
        # container restart loop — readiness is monitored via /health/ready, not
        # used as a restart gate. See INF-L1 / INF-L2.
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Runtime fallback for any server-side fetch to the API (proxy is baked at build).
      API_BASE_URL: http://api:3333
    ports:
      - "3210:3000"
    healthcheck:
      # Require a real 2xx (r.ok) — the old r.status<500 let a 404/301 pass green
      # (the standalone server has no public/ assets so / must render 200). INF-M3.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - bushpop-net

volumes:
  bushpop-pg-data:
  bushpop-redis-data:
  bushpop-meili-data:

networks:
  bushpop-net:
    driver: bridge
