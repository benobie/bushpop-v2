# Engine CI — the piklo-v2-fork marketplace engine (packages/*, apps/market).
# Path-filtered so content-site-only changes (apps/web) never run these jobs;
# the content site keeps its own CI + deploy in deploy.yml.
# Forked from piklo-v2 .github/workflows/ci.yml @ 2419a38 (see docs/engine/FORK.md).
name: Engine CI

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/market/**"
      - "infra/**"
      - "scripts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".github/workflows/engine-ci.yml"
  pull_request:
    branches: [main]
    # Keep in sync with the push paths above (GH Actions YAML has no anchors).
    paths:
      - "packages/**"
      - "apps/market/**"
      - "infra/**"
      - "scripts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".github/workflows/engine-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Builds the whole workspace, including the apps/web static export —
      # doubling as proof that engine changes leave the content build green.
      - run: pnpm build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bushpop
          POSTGRES_USER: bushpop
          POSTGRES_PASSWORD: bushpop_dev
        # Map host 5435 → container 5432 to match vitest.config.ts DATABASE_URL
        # (5435 locally clears life-dashboard on 5433 and piklo on 5434).
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U bushpop -d bushpop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.40
        env:
          MEILI_MASTER_KEY: dev_master_key_change_in_production
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7701:7700
    env:
      # Mirror packages/api/vitest.config.ts so the migrate/seed steps and the
      # test runner all hit the same bushpop_test database.
      DATABASE_URL: postgres://bushpop:bushpop_dev@localhost:5435/bushpop_test
      REDIS_URL: redis://localhost:6380
      MEILISEARCH_HOST: http://localhost:7701
      MEILI_MASTER_KEY: dev_master_key_change_in_production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Create the bushpop_test database (the compose flow assumes it exists).
      - name: Create bushpop_test database
        run: |
          PGPASSWORD=bushpop_dev psql -h localhost -p 5435 -U bushpop -d bushpop \
            -c "CREATE DATABASE bushpop_test;" || true

      # Apply Drizzle migrations to bushpop_test.
      - name: Apply migrations
        run: pnpm --filter @bushpop/db db:migrate

      # Seed the bushpop channel + categories (idempotent; tests assume the
      # bushpop channel + a category exist and never truncate categories).
      - name: Seed reference data
        run: |
          pnpm --filter @bushpop/db db:seed
          pnpm --filter @bushpop/db db:seed:categories

      - run: pnpm --filter @bushpop/api test

  market-webpack-build:
    name: Market Build (webpack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Turbopack build is already covered by the `build` job above.
      # This job pins the webpack builder so a Next.js upgrade can't silently
      # regress the non-default build path.
      - run: pnpm --filter @bushpop/market exec next build --webpack

  e2e:
    name: E2E (Playwright checkout + sell-wizard)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bushpop
          POSTGRES_USER: bushpop
          POSTGRES_PASSWORD: bushpop_dev
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U bushpop -d bushpop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.40
        env:
          MEILI_MASTER_KEY: dev_master_key_change_in_production
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7701:7700
    env:
      # Real DB/redis/meili, matching the `test` job above.
      DATABASE_URL: postgres://bushpop:bushpop_dev@localhost:5435/bushpop
      REDIS_URL: redis://localhost:6380
      MEILISEARCH_HOST: http://localhost:7701
      MEILI_MASTER_KEY: dev_master_key_change_in_production
      CHANNEL_SLUG: bushpop
      NODE_ENV: development
      # Fixed dev-stack ports/URLs (matches apps/market/playwright.config.ts + .env.example).
      WEB_URL: http://localhost:3002
      ADMIN_URL: http://localhost:3001
      API_URL: http://localhost:3333
      API_BASE_URL: http://localhost:3333
      API_HOST: 0.0.0.0
      API_PORT: 3333
      BETTER_AUTH_SECRET: e2e_ci_secret_not_used_in_prod_needs_32_chars
      R2_PUBLIC_URL: https://media.bushpop.com.au
      # Real Stripe TEST-mode keys (repo secrets) — this spec drives a real
      # PaymentIntent against Stripe's own test-mode API, then self-delivers
      # the webhook rather than relying on Stripe CLI (see checkout.spec.ts's
      # header comment for why). STRIPE_WEBHOOK_SECRET is a repo-generated
      # shared HMAC secret, not a Stripe dashboard value — the API and the
      # spec just need to agree on it.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      # Not exercised by the checkout flow — dummy values satisfy validateEnv's
      # required (non-optional) StarShipIt keys.
      STARSHIPIT_API_KEY: e2e_ci_unused_dummy
      STARSHIPIT_WEBHOOK_SECRET: e2e_ci_unused_dummy
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @bushpop/market exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm --filter @bushpop/db db:migrate

      - name: Seed reference data
        run: |
          pnpm --filter @bushpop/db db:seed
          pnpm --filter @bushpop/db db:seed:categories

      - name: Start API server
        run: |
          nohup pnpm --filter @bushpop/api start:prod > api-server.log 2>&1 &
          disown

      - name: Wait for API
        run: npx wait-on -t 60000 http://localhost:3333/health/ready

      - name: Upload API server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-server-log
          path: api-server.log
          retention-days: 14

      - name: Run checkout + sell-wizard E2E
        run: pnpm --filter @bushpop/market exec playwright test e2e/checkout.spec.ts e2e/sell-wizard.spec.ts
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/market/playwright-report/
          retention-days: 14

  cache-audit:
    name: Cache Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pure shell/grep script — no pnpm install needed.
      # Asserts every `'use cache'` function under apps/market/src/ has at
      # least one matching revalidateTag() invalidation site.
      - run: scripts/cache-audit.sh

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Critical CVEs block the merge. Transitive criticals are pinned to patched
      # versions via pnpm `overrides` in the root package.json — keep that list
      # current rather than re-adding continue-on-error when a new critical lands.
      - run: pnpm audit --audit-level=critical

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
