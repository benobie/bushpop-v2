name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The `deploy` job declares the extra scopes it
# needs; `build` should never have had more than read.
permissions:
  contents: read

jobs:
  # Build is independent of deploy so it gives a clean green CI signal even if a
  # deploy step is ever re-run or reconfigured. The static export (out/) is the
  # build output Cloudflare Pages serves.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        # Filtered to the content site only: engine packages (packages/*,
        # apps/market) must never be installed here, so an engine dep change
        # can't break or bloat the content deploy. @bushpop/web has zero
        # workspace deps, so this installs just the web app.
        run: pnpm install --frozen-lockfile --filter @bushpop/web...

      - name: Typecheck
        # Content-site scope only: an engine (packages/*, apps/market) type
        # error must never block the content deploy through the DNS-cut
        # window. Engine typechecking lives in engine-ci.yml.
        run: pnpm --filter @bushpop/web typecheck

      - name: Build (static export)
        run: pnpm --filter @bushpop/web build

  # Deploy is isolated and only runs on push to main, so it can be re-run
  # independently if needed.
  #
  # STATUS (working, verified 30/06/2026): the CLOUDFLARE_API_TOKEN secret has
  # Cloudflare Pages:Edit scope, so this job deploys apps/web/out to the
  # bushpop-v2 Pages project on every push to main (staging: bushpop-v2.pages.dev).
  # The CLOUDFLARE_ACCOUNT_ID secret is also set. See bushpop-v2 README +
  # ~/projects/Bushpop/docs/architecture-decisions.md.
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        # Same content-site-only filter as the build job (engine exclusion).
        run: pnpm install --frozen-lockfile --filter @bushpop/web...

      - name: Build (static export)
        run: pnpm --filter @bushpop/web build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        # Inject credentials as env vars too (belt-and-braces): wrangler reads
        # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID directly from the
        # environment, which is more robust than relying on action inputs alone.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `wrangler pages deploy` resolves the Pages Functions directory
          # relative to its OWN cwd, not relative to the output dir passed as
          # an argument. functions/ lives at apps/web/functions/, so
          # workingDirectory must point there (Batch 33 Workstream B2 fix —
          # the Function was silently never deployed before this).
          workingDirectory: apps/web
          command: pages deploy out --project-name bushpop-v2 --commit-dirty=true

      - name: Wait for deploy
        # Cloudflare Pages deploys are async — the wrangler step above returns
        # as soon as the deployment is queued, not once it's actually live.
        # Poll the staging URL until it answers 200 before running smoke
        # tests against it, so we don't false-fail on a not-yet-propagated
        # deploy.
        run: |
          for i in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://bushpop-v2.pages.dev/ || echo "000")
            if [ "$status" = "200" ]; then
              echo "Deploy is live (attempt $i, status $status)"
              exit 0
            fi
            echo "Attempt $i: status $status, retrying in 2s..."
            sleep 2
          done
          echo "Deploy did not become live after 15 attempts"
          exit 1

      - name: Redirect smoke test
        run: node apps/web/scripts/check-redirects.mjs --base https://bushpop-v2.pages.dev --fixture apps/web/scripts/fixtures/redirect-fixture.csv

      - name: Post-deploy hygiene
        run: node apps/web/scripts/post-deploy-check.mjs --base https://bushpop-v2.pages.dev
